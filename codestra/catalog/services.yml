version: 2
owner: Codestra Platform
status: CONFIG_PREPARED_NOT_DEPLOYED

authorities:
  metrics_collection_recording_slo_alerts: appolon1908-hue/Codestra-Prometheus
  alert_routing: appolon1908-hue/Codestra-Alertmanager
  telemetry_gateway: appolon1908-hue/Codestra-Telemetry
  node_exporter: appolon1908-hue/Codestra-Node-Exporter
  cadvisor: appolon1908-hue/Codestra-cAdvisor
  postgres_exporter: appolon1908-hue/Codestra-Postgres-Exporter
  redis_exporter: appolon1908-hue/Codestra-Redis-Exporter
  blackbox_exporter: appolon1908-hue/Codestra-Blackbox-Exporter

required_labels:
  - codestra_business
  - application
  - service
  - environment
  - server
  - region
  - deployment
  - activation
  - job_class
  - tenant_scope

forbidden_high_cardinality_labels:
  - tenant_id
  - customer_id
  - account_id
  - user_id
  - request_id
  - correlation_id
  - trace_id
  - span_id
  - email
  - phone
  - message_id
  - order_id
  - workflow_id
  - execution_id
  - raw_url
  - query_string
  - db_statement
  - container_id
  - pod_uid
  - exception_message

businesses:
  - {id: codestra, display_name: Codestra, service_tier: tier_1}
  - {id: moneybee, display_name: MoneyBee, service_tier: tier_1}
  - {id: beyvra, display_name: Beyvra Trading, service_tier: tier_1}
  - {id: breero, display_name: Breero, service_tier: tier_1}
  - {id: larim-a, display_name: LARIM-A, service_tier: tier_1}
  - {id: transportation, display_name: Transportation and Freight, service_tier: tier_1}
  - {id: booked4seasons, display_name: Booked4Seasons, service_tier: tier_2}
  - {id: social, display_name: Codestra Social, service_tier: tier_2}
  - {id: klyrow, display_name: Klyrow Email, service_tier: tier_1}
  - {id: telnexa, display_name: Telnexa Messaging, service_tier: tier_1}
  - {id: kyqra, display_name: Kyqra, service_tier: tier_2}
  - {id: restaurant, display_name: Restaurant Platform, service_tier: tier_2}
  - {id: provisioning, display_name: Codestra Provisioning, service_tier: tier_1}

required_application_metrics:
  - codestra_http_requests_total
  - codestra_http_request_duration_seconds
  - codestra_dependency_latency_seconds
  - codestra_database_latency_seconds
  - codestra_queue_depth
  - codestra_worker_failures_total
  - codestra_outbox_backlog
  - codestra_outbox_oldest_age_seconds
  - codestra_inbox_backlog
  - codestra_inbox_oldest_age_seconds
  - codestra_webhook_deliveries_total
  - codestra_webhook_retries_total
  - codestra_authentication_failures_total
  - codestra_authorization_denials_total
  - codestra_idempotency_conflicts_total
  - codestra_reconciliation_failures_total
  - codestra_external_provider_failures_total
  - codestra_deployment_info
  - codestra_capability_state

infrastructure_services:
