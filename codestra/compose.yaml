name: codestra-prometheus-authority

services:
  prometheus:
    image: docker.io/prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      CODESTRA_SOURCE_SHA: ${CODESTRA_SOURCE_SHA:?required protected source SHA}
      CODESTRA_IMAGE_DIGEST: sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-40GB}
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-admin-api=false
      - --web.enable-lifecycle=false
      - --query.max-concurrency=20
      - --query.timeout=2m
    ports:
      - ${PROMETHEUS_LISTEN_ADDRESS:-127.0.0.1:9090}:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - ./blackbox/targets-production.json:/etc/prometheus/blackbox-targets/production.json:ro
      - prometheus_data:/prometheus
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks:
      observability:
        aliases:
          - prometheus
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  observability:
    external: true
    name: ${CODESTRA_OBSERVABILITY_NETWORK:-codestra-observability}

volumes:
  prometheus_data:
