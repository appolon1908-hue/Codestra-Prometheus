groups:
  - name: codestra-observability-health
    rules:
      - alert: CodestraExporterDown
        expr: up{job="codestra-targets",job_class=~"host|container|database|observability"} == 0
        for: 2m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "{{ $labels.service }} is down on {{ $labels.server }}"
          description: "Prometheus has failed to scrape the target for two minutes."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraPrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
          owner: observability
        annotations:
          summary: "Prometheus rule evaluation failures"
          description: "At least one rule evaluation failed during the last ten minutes."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraPrometheusConfigReloadFailure
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
          owner: observability
        annotations:
          summary: "Prometheus configuration reload failed"
          description: "The active Prometheus configuration could not be reloaded."
          runbook: "codestra/README.md#validation-and-rollout"

  - name: codestra-host-health
    rules:
      - alert: CodestraNodeCpuHigh
        expr: 100 - (avg by (environment, server, instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 15m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "CPU high on {{ $labels.server }}"
          description: "CPU utilization has exceeded 90% for fifteen minutes."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraNodeMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Memory high on {{ $labels.server }}"
          description: "Memory utilization has exceeded 90% for ten minutes."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraNodeDiskLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 15m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Disk space low on {{ $labels.server }}"
          description: "Filesystem {{ $labels.mountpoint }} has less than 15% free space."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraContainerMemoryHigh
        expr: (container_memory_working_set_bytes{name!="",container_label_com_docker_compose_service!=""} / container_spec_memory_limit_bytes{name!="",container_label_com_docker_compose_service!=""}) > 0.90 and container_spec_memory_limit_bytes > 0
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Container memory high on {{ $labels.server }}"
          description: "Container {{ $labels.name }} is using more than 90% of its configured limit."
          runbook: "codestra/README.md#validation-and-rollout"

  - name: codestra-database-health
    rules:
      - alert: CodestraPostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
          owner: database
        annotations:
          summary: "PostgreSQL is unavailable"
          description: "PostgreSQL exporter cannot reach its configured database."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraPostgresConnectionsHigh
        expr: sum by (environment, server, instance) (pg_stat_activity_count) / clamp_min(max by (environment, server, instance) (pg_settings_max_connections), 1) > 0.85
        for: 10m
        labels:
          severity: warning
          owner: database
        annotations:
          summary: "PostgreSQL connection usage high"
          description: "Connection usage has exceeded 85%."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraRedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
          owner: database
        annotations:
          summary: "Redis is unavailable"
          description: "Redis exporter cannot reach its configured Redis instance."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraRedisMemoryHigh
        expr: redis_memory_used_bytes / clamp_min(redis_memory_max_bytes, 1) > 0.90 and redis_memory_max_bytes > 0
        for: 10m
        labels:
          severity: warning
          owner: database
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using more than 90% of maxmemory."
          runbook: "codestra/README.md#validation-and-rollout"

  - name: codestra-blackbox-health
    rules:
      - alert: CodestraPublicProbeFailed
        expr: probe_success{job="blackbox",probe_enabled="true"} == 0
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Public probe failed for {{ $labels.service }}"
          description: "Blackbox probe to {{ $labels.instance }} has failed for five minutes."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraTlsCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox",probe_enabled="true"} - time()) < 1209600
        for: 1h
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "TLS certificate expires within 14 days"
          description: "Certificate for {{ $labels.instance }} is nearing expiration."
          runbook: "codestra/README.md#validation-and-rollout"
