groups:
  - name: codestra-security-and-safety
    rules:
      - alert: CodestraAuthenticationFailuresSpike
        expr: sum without (reason) (codestra:authentication_failures:rate5m) > 5
        for: 5m
        labels:
          severity: warning
          owner: security
        annotations:
          summary: "Authentication failures spiking for {{ $labels.application }}/{{ $labels.service }}"
          description: "Authentication failures exceed five per second."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraAuthorizationDenialsSpike
        expr: sum without (reason, result) (codestra:authorization_denials:rate5m) > 5
        for: 5m
        labels:
          severity: warning
          owner: security
        annotations:
          summary: "Authorization denials spiking for {{ $labels.application }}/{{ $labels.service }}"
          description: "Authorization denials exceed five per second."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraIdempotencyConflictsHigh
        expr: sum without (operation) (codestra:idempotency_conflicts:rate5m) > 1
        for: 5m
        labels:
          severity: warning
          owner: application
        annotations:
          summary: "Idempotency conflicts are elevated"
          description: "Conflicts exceed one per second for {{ $labels.application }}/{{ $labels.service }}."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraReconciliationFailures
        expr: sum without (reconciliation) (codestra:reconciliation_failures:rate5m) > 0
        for: 5m
        labels:
          severity: critical
          owner: integration
        annotations:
          summary: "Reconciliation failures detected"
          description: "Reconciliation is failing for {{ $labels.application }}/{{ $labels.service }}."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraExternalProviderFailures
        expr: sum without (provider, reason) (codestra:external_provider_failures:rate5m) > 0.2
        for: 10m
        labels:
          severity: critical
          owner: integration
        annotations:
          summary: "External provider failures elevated"
          description: "Provider failure rate exceeds 0.2/s for {{ $labels.application }}/{{ $labels.service }}."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraUnapprovedLiveCapability
        expr: codestra_capability_state{risk_class="live_external_effect",mode="enabled",approval_state!="approved"} == 1
        for: 1m
        labels:
          severity: critical
          owner: security
        annotations:
          summary: "Unapproved live capability enabled"
          description: "Capability {{ $labels.capability }} is enabled without approved activation evidence."
          runbook: "codestra/README.md#validation-and-rollout"

      - alert: CodestraLiveCapabilityOutsideProduction
        expr: codestra_capability_state{risk_class="live_external_effect",mode="enabled",environment!="production"} == 1
        for: 1m
        labels:
          severity: critical
          owner: security
        annotations:
          summary: "Live capability enabled outside production"
          description: "Capability {{ $labels.capability }} is enabled in {{ $labels.environment }}."
          runbook: "codestra/README.md#validation-and-rollout"
