global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    platform: codestra
    prometheus_cluster: codestra-primary
    region: hetzner-eu

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alert_relabel_configs:
    - action: labeldrop
      regex: prometheus_replica
  alertmanagers:
    - scheme: http
      timeout: 10s
      static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          activation: active
          job_class: observability
          environment: production
          server: codestra-core-01
          application: observability
          service: prometheus
          tenant_scope: aggregate

  - job_name: codestra-targets
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [activation]
        regex: active
        action: keep
    metric_relabel_configs:
      - action: labeldrop
        regex: '(?i)^(tenant_id|tenant_name|organization_id|organization_name|customer_id|customer_name|account_id|user_id|user_name|email|phone|consumer|workspace|token|secret|password|session_id|request_id|correlation_id|trace_id|span_id|lead_id|order_id|message_id|workflow_id|execution_id|webhook_id|idempotency_key|raw_path|path|uri|url|query|query_string|container_id|image_id|id)$'

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/blackbox-targets/*.json"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [probe_enabled]
        regex: "true"
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
