name: codestra-prometheus-staging

services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    container_name: codestra-prometheus-staging
    init: true
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=40GB
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-admin-api=false
      - --web.enable-lifecycle=false
      - --query.max-concurrency=20
      - --query.timeout=2m
    expose:
      - "9090"
    volumes:
      - ../prometheus/prometheus-staging.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - ../prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_staging_data:/prometheus
    secrets:
      - source: middleware_staging_monitoring_client_secret
        target: middleware-staging-monitoring-client-secret
        mode: 0444
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks:
      codestra_observability:
        aliases:
          - prometheus
      middleware_staging: {}
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      com.codestra.service: prometheus
      com.codestra.environment: staging
      com.codestra.source.repository: appolon1908-hue/Codestra-Prometheus
      com.codestra.source.sha: ${PROMETHEUS_SOURCE_SHA:?exact merged source SHA is required}

networks:
  codestra_observability:
    external: true
    name: codestra-observability
  middleware_staging:
    external: true
    name: codestra-intake-observability-staging_private

volumes:
  prometheus_staging_data:

secrets:
  middleware_staging_monitoring_client_secret:
    file: ${MIDDLEWARE_METRICS_CLIENT_SECRET_FILE:?OpenBao-rendered metrics client secret file is required}
