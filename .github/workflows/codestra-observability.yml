name: Codestra observability validation

on:
  pull_request:
    paths:
      - "codestra/**"
      - ".github/workflows/codestra-observability.yml"
  push:
    branches: [development, test, staging, production, main]
    paths:
      - "codestra/**"
      - ".github/workflows/codestra-observability.yml"

permissions:
  contents: read

concurrency:
  group: codestra-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3
      - name: Validate Codestra policy
        run: python codestra/scripts/validate.py
      - uses: actions/setup-go@v6
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum
      - name: Build pinned upstream promtool
        working-directory: upstream
        run: go build -trimpath -o ../.bin/promtool ./cmd/promtool
      - name: Validate Prometheus configuration
        run: .bin/promtool check config codestra/prometheus/prometheus.yml
      - name: Validate Prometheus rules
        run: .bin/promtool check rules codestra/prometheus/rules/*.yml
