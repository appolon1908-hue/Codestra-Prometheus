name: Validate repository aliases and private exporter authority

on:
  pull_request:
    paths:
      - "codestra/catalog/repository-name-aliases.v1.json"
      - "codestra/catalog/services.yml"
      - "codestra/compose.yaml"
      - "codestra/prometheus/**"
      - "codestra/blackbox/**"
      - "codestra/enterprise-profile.v1.json"
      - "scripts/validate_repository_alias_authority.py"
      - "scripts/validate_repository_readiness.py"
      - "tests/test_repository_alias_authority.py"
      - ".github/workflows/validate-repository-alias-authority.yml"
  push:
    branches:
      - main
      - development
      - test
      - staging
      - production
    paths:
      - "codestra/catalog/repository-name-aliases.v1.json"
      - "codestra/catalog/services.yml"
      - "codestra/compose.yaml"
      - "codestra/prometheus/**"
      - "codestra/blackbox/**"
      - "codestra/enterprise-profile.v1.json"
      - "scripts/validate_repository_alias_authority.py"
      - "scripts/validate_repository_readiness.py"
      - "tests/test_repository_alias_authority.py"
      - ".github/workflows/validate-repository-alias-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-alias-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact source identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install pinned validation dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Validate repository aliases and private exporter authority
        run: |
          python -m py_compile scripts/validate_repository_alias_authority.py tests/test_repository_alias_authority.py
          python scripts/validate_repository_alias_authority.py
          python tests/test_repository_alias_authority.py
