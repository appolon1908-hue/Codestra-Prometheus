name: Controlled intake staging activation preparation gate

on:
  pull_request:
    paths:
      - "codestra/prometheus/targets/staging.json"
      - "codestra/scripts/validate_staging_intake_observability.py"
      - "codestra/scripts/validate_staging_intake_observability_activation.py"
      - "codestra/scripts/validate_staging_intake_observability_contract.py"
      - "integration/staging-activation-contract-v1.json"
      - "integration/staging-runtime-evidence-v1.json"
      - "integration/staging-runtime-evidence-v1.sig"
      - "integration/staging-evidence-signing-public.pem"
      - ".github/workflows/controlled-intake-staging-activation-gate.yml"
  workflow_dispatch:
    inputs:
      execution_reason:
        description: "Why is this integration being executed?"
        required: true
        type: string
      change_id:
        description: "Approved staging certification identifier"
        required: true
        type: string
      expected_branch_head:
        description: "Exact 40-character branch SHA being certified"
        required: true
        type: string
      middleware_image_digest:
        description: "Verified immutable Middleware digest"
        required: true
        type: string
      staging_evidence_checksum:
        description: "Passing runtime evidence checksum"
        required: true
        type: string
      confirm_prometheus_only:
        description: "Only the approved Prometheus target may later become active"
        required: true
        type: boolean
      confirm_blackbox_pending:
        description: "Blackbox remains pending"
        required: true
        type: boolean
      confirm_no_external_effects:
        description: "No external effect or production mutation is authorized"
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: controlled-intake-staging-activation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-preparation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3
      - name: Validate signed immutable Middleware release lock
        env:
          ACTIVATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          data = json.loads(Path("integration/staging-activation-contract-v1.json").read_text())
          target = json.loads(Path("codestra/prometheus/targets/staging.json").read_text())
          activation = target[0]["labels"]["activation"]
          if activation == "active":
              subprocess.run(
                  [
                      "python3",
                      "codestra/scripts/validate_staging_intake_observability_contract.py",
                  ],
                  check=True,
                  env=os.environ.copy(),
              )
              raise SystemExit(0)
          assert activation == "pending"
          assert data["schema_version"] == "1.1"
          assert data["suite_id"] == "codestra-controlled-intake-monitoring-v1"
          assert data["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert data["execution_question"] == "Why is this integration being executed?"
          assert data["execution_reason_required"] is True
          assert data["source_only_preparation"] is True

          source = data["middleware_source_authority"]
          expected = {
              "repository": "appolon1908-hue/Middleware-",
              "source_sha": "9a96ff1651a324b98f3a7efd60b7a342983ded4e",
              "source_state": "MERGED_REVIEWED_EXACT_SHA",
              "immutable_image_reference": "ghcr.io/appolon1908-hue/codestra-middleware@sha256:01a61e6c9761968bce04db855df565e9104338c2ba2056da570cacb9fd21f0f4",
              "immutable_image_digest": "sha256:01a61e6c9761968bce04db855df565e9104338c2ba2056da570cacb9fd21f0f4",
              "image_digest_state": "VERIFIED_SIGNED_IMMUTABLE_IMAGE_AVAILABLE",
              "release_id": "9a96ff1651a3-01a61e6c9761",
              "release_run_id": 33662230894,
              "release_run_attempt": 2,
              "release_run_url": "https://github.com/appolon1908-hue/Middleware-/actions/runs/33662230894",
              "release_artifact_name": "signed-middleware-release-9a96ff1651a324b98f3a7efd60b7a342983ded4e-33662230894-2",
              "release_built_at": "2026-09-02T17:41:48Z",
              "release_workflow_path": ".github/workflows/release.yml",
              "release_workflow_identity": "https://github.com/appolon1908-hue/Middleware-/.github/workflows/release.yml@refs/heads/main",
              "release_oidc_issuer": "https://token.actions.githubusercontent.com",
              "release_manifest_schema_version": "1.0",
              "release_manifest_verification": "PASS_IN_SIGNED_RELEASE_WORKFLOW",
              "signed_release_artifact_sha256": "sha256:56fc7bd5cca57df0bfd04e27eb3e294bd160a8071e4e8ae1974addb6d040f46e",
              "sbom_sha256": "sha256:2aef347da05c39956671e9f431b36dd5b8a2a0ec76a72ded155b062db321c3ea",
              "vulnerability_report_sha256": "sha256:4652fc5b7de5be1e0f7e2c977a3970a09d47df71a4ddff5bc3866b32f01a6e49",
              "image_signature": "sigstore-keyless",
              "manifest_signature": "sigstore-keyless-bundle",
              "transparency_log_required": True,
              "vulnerability_policy": "fail-high-or-critical-with-fix",
              "platforms": ["linux/amd64"],
              "schema_or_migration_head": "0008_durable_communications",
              "external_effects_default": "disabled",
          }
          for key, value in expected.items():
              assert source[key] == value, (key, source.get(key), value)
          hash_keys = ("immutable_image_digest", "signed_release_artifact_sha256", "sbom_sha256", "vulnerability_report_sha256")
          assert all(re.fullmatch(r"sha256:[0-9a-f]{64}", source[key]) for key in hash_keys)

          declared = data["private_endpoints"]
          allowed = {
              ("GET", "/metrics", "monitoring-readonly", "metrics.read", False),
              ("GET", "/v1/runtime/safety", "monitoring-readonly", "health.read", False),
          }
          actual = {(item["method"], item["path"], item["client_id"], item["scope"], item["public_exposure"]) for item in declared}
          assert len(declared) == len(allowed)
          assert actual == allowed
          assert all(item["method"] == "GET" and item["client_id"] == "monitoring-readonly" and item["public_exposure"] is False for item in declared)

          credentials = data["staging_credentials"]
          assert credentials["storage"] == "OUTSIDE_GIT"
          assert credentials["static_tokens_allowed"] is False
          assert credentials["secret_values_committed"] is False
          assert 60 <= credentials["minimum_token_ttl_seconds"] <= credentials["maximum_token_ttl_seconds"] <= 900

          evidence = data["staging_evidence"]
          assert evidence["collector_repository"] == "appolon1908-hue/Codestra-Prometheus"
          assert evidence["checksum"] is None
          assert evidence["signature_path"] is None
          assert evidence["signature_algorithm"] == "ed25519"
          assert evidence["signing_public_key_path"] == "integration/staging-evidence-signing-public.pem"
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", evidence["signing_key_id"])
          assert evidence["signing_authority"] == "codestra-observability-host-37.27.128.39-root-protected-collector"
          assert evidence["state"] == "PENDING_RUNTIME_EXECUTION"
          assert {"signed_release_manifest", "sigstore_identity", "host_evidence_signature"}.issubset(evidence["must_verify"])

          policy = data["activation_policy"]
          assert policy["prometheus_target_current_state"] == "pending"
          assert policy["prometheus_target_allowed_next_state"] == "active"
          assert policy["only_prometheus_target_may_transition"] is True
          assert policy["prometheus_activation_pr_required"] is True
          assert policy["prometheus_activation_pr_must_cite_image_digest"] is True
          assert policy["prometheus_activation_pr_must_cite_evidence_checksum"] is True
          assert policy["blackbox_target_current_state"] == "pending"
          assert policy["blackbox_must_remain_pending"] is True
          assert policy["blackbox_activation_requires_independent_review"] is True
          assert policy["blackbox_probe_must_be_side_effect_free"] is True
          assert policy["blackbox_allowed_methods"] == ["GET", "HEAD"]
          if data["component"] == "blackbox_exporter":
              assert policy["blackbox_allowed_status"] == "PENDING_ONLY"
          assert policy["production_activation_authorized"] is False
          assert all(value is False for value in data["runtime_effects"].values())
          print("CONTROLLED_STAGING_IMMUTABLE_DIGEST_LOCK=PASS")
          PY

  verify-execution-evidence-inputs:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-preparation-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXECUTION_REASON: ${{ inputs.execution_reason }}
      CHANGE_ID: ${{ inputs.change_id }}
      EXPECTED_BRANCH_HEAD: ${{ inputs.expected_branch_head }}
      MIDDLEWARE_IMAGE_DIGEST: ${{ inputs.middleware_image_digest }}
      STAGING_EVIDENCE_CHECKSUM: ${{ inputs.staging_evidence_checksum }}
      CONFIRM_PROMETHEUS_ONLY: ${{ inputs.confirm_prometheus_only }}
      CONFIRM_BLACKBOX_PENDING: ${{ inputs.confirm_blackbox_pending }}
      CONFIRM_NO_EXTERNAL_EFFECTS: ${{ inputs.confirm_no_external_effects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify runtime evidence references
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          reason = " ".join(os.environ["EXECUTION_REASON"].split())
          if len(reason) < 40:
              raise SystemExit("execution_reason must explain the operational need")
          if not re.fullmatch(r"CHG-[A-Z0-9][A-Z0-9._-]{7,}", os.environ["CHANGE_ID"].strip().upper()):
              raise SystemExit("change_id must use CHG-* format")
          expected_head = os.environ["EXPECTED_BRANCH_HEAD"].strip().lower()
          actual_head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if not re.fullmatch(r"[0-9a-f]{40}", expected_head) or actual_head != expected_head:
              raise SystemExit("exact-head validation failed")

          source = json.loads(Path("integration/staging-activation-contract-v1.json").read_text())["middleware_source_authority"]
          image = os.environ["MIDDLEWARE_IMAGE_DIGEST"].strip().lower()
          evidence = os.environ["STAGING_EVIDENCE_CHECKSUM"].strip().lower()
          pattern = r"sha256:[0-9a-f]{64}"
          if not re.fullmatch(pattern, image) or image != source["immutable_image_digest"]:
              raise SystemExit("image digest must exactly match the contract lock")
          if not re.fullmatch(pattern, evidence):
              raise SystemExit("runtime evidence checksum must use sha256:<64 lowercase hex>")
          forbidden_evidence = {source["immutable_image_digest"], source["signed_release_artifact_sha256"], source["sbom_sha256"], source["vulnerability_report_sha256"]}
          if evidence in forbidden_evidence:
              raise SystemExit("runtime evidence must differ from every release or image checksum")
          for name in ("CONFIRM_PROMETHEUS_ONLY", "CONFIRM_BLACKBOX_PENDING", "CONFIRM_NO_EXTERNAL_EFFECTS"):
              if os.environ[name].lower() != "true":
                  raise SystemExit(f"{name.lower()} confirmation is required")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Controlled staging evidence references\n")
              summary.write(f"- Why executed: {reason}\n- Exact head: `{actual_head}`\n")
              summary.write(f"- Locked Middleware image: `{image}`\n- Runtime evidence: `{evidence}`\n")
              summary.write("- Prometheus activation: **separate PR required**\n")
              summary.write("- Blackbox: **pending**\n- Deployment by this workflow: **No**\n")
          print("CONTROLLED_STAGING_EVIDENCE_REFERENCES=PASS")
          PY
