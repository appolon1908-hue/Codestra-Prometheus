name: Build exact Prometheus production bundle

on:
  push:
    branches:
      - evidence/exact-production-bundle-20260903

permissions:
  contents: read

concurrency:
  group: exact-prometheus-production-bundle
  cancel-in-progress: false

env:
  SOURCE_SHA: 660b976e01caa64667bc63953f32187df26d4e75
  SOURCE_TREE: ade8a3c224e6fc7679ba833c5a9370554636ea60
  PROMETHEUS_IMAGE: docker.io/prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
  PROMETHEUS_IMAGE_REPOSITORY: prom/prometheus
  PROMETHEUS_IMAGE_DIGEST: 63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996

jobs:
  certify-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact signed staging source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 660b976e01caa64667bc63953f32187df26d4e75
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Verify exact source and tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$SOURCE_TREE"
          test "$(jq -r .image codestra/release/runtime-image.lock.json)" = "$PROMETHEUS_IMAGE"
          test "$(jq -r .productionActivation codestra/release/runtime-image.lock.json)" = "false"

      - name: Re-run deterministic repository and runtime gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r requirements-validation.txt
          python3 codestra/scripts/validate.py
          python3 codestra/scripts/validate_runtime_images.py
          python3 scripts/validate_repository_readiness.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          CODESTRA_SOURCE_SHA="$SOURCE_SHA" docker compose --file codestra/compose.yaml config >/tmp/prometheus-compose-rendered.yaml
          bash scripts/validate_locked_runtime.sh "$SOURCE_SHA"

      - name: Build deterministic configuration bundle and evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0755 release-evidence
          python3 scripts/build_config_bundle.py --output release-evidence/prometheus-config.tar.gz | tee release-evidence/build-output.txt
          bundle_sha="$(sha256sum release-evidence/prometheus-config.tar.gz | awk '{print $1}')"
          manifest_sha="$(sha256sum codestra/release/config-bundle.manifest.json | awk '{print $1}')"
          compose_sha="$(sha256sum /tmp/prometheus-compose-rendered.yaml | awk '{print $1}')"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUNDLE_SHA="$bundle_sha" MANIFEST_SHA="$manifest_sha" COMPOSE_SHA="$compose_sha" GENERATED_AT="$generated_at" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": "1.0",
              "component": "prometheus",
              "repository": "appolon1908-hue/Codestra-Prometheus",
              "source_sha": os.environ["SOURCE_SHA"],
              "source_tree": os.environ["SOURCE_TREE"],
              "image": os.environ["PROMETHEUS_IMAGE"],
              "config_bundle_sha256": "sha256:" + os.environ["BUNDLE_SHA"],
              "config_manifest_sha256": "sha256:" + os.environ["MANIFEST_SHA"],
              "rendered_compose_sha256": "sha256:" + os.environ["COMPOSE_SHA"],
              "generated_at": os.environ["GENERATED_AT"],
              "repository_validation": "PASS",
              "locked_runtime_validation": "PASS",
              "production_activation": False,
              "business_writes_performed": False,
              "runtime_deployed": False,
          }
          Path("release-evidence/production-source-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cp codestra/release/config-bundle.manifest.json release-evidence/
          cp codestra/release/runtime-image.lock.json release-evidence/
          cp /tmp/prometheus-compose-rendered.yaml release-evidence/
          sha256sum release-evidence/* > release-evidence/SHA256SUMS
          chmod -R a-w release-evidence

      - name: Upload exact immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prometheus-production-config-660b976e01caa64667bc63953f32187df26d4e75
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
