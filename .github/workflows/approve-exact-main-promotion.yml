name: Approve exact certified Prometheus main promotion

on:
  push:
    branches:
      - automation/approve-exact-main-promotion-20260903

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write

concurrency:
  group: approve-prometheus-main-pr-53
  cancel-in-progress: false

env:
  TARGET_PR: "53"
  EXPECTED_BASE_REF: main
  EXPECTED_BASE_SHA: 12b79875cf01033d1a5bd29462fc70bed0e4bbfb
  EXPECTED_HEAD_SHA: 25ece9398cdfa9392a3614979254ee01a1f183c5
  SIGNED_STAGING_SHA: 660b976e01caa64667bc63953f32187df26d4e75
  EXPECTED_TREE_SHA: ade8a3c224e6fc7679ba833c5a9370554636ea60

jobs:
  exact-head-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact promotion head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 25ece9398cdfa9392a3614979254ee01a1f183c5
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source, ancestry, review threads and all checks
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git show -s --format=%T HEAD)" = "$EXPECTED_TREE_SHA"

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR")"
          jq -e \
            --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            '.state == "open"
             and .draft == false
             and .base.ref == $base_ref
             and .base.sha == $base_sha
             and .head.sha == $head_sha
             and .mergeable == true
             and (.mergeable_state == "clean" or .mergeable_state == "blocked")' \
            <<<"$pr_json" >/dev/null

          compare_json="$(gh api "repos/$GITHUB_REPOSITORY/compare/${EXPECTED_BASE_SHA}...${EXPECTED_HEAD_SHA}")"
          jq -e '.status == "ahead" and .ahead_by == 1 and .behind_by == 0' <<<"$compare_json" >/dev/null

          head_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$EXPECTED_HEAD_SHA")"
          jq -e --arg tree "$EXPECTED_TREE_SHA" '.tree.sha == $tree' <<<"$head_commit" >/dev/null

          staging_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SIGNED_STAGING_SHA")"
          jq -e \
            --arg tree "$EXPECTED_TREE_SHA" \
            '.commit.tree.sha == $tree
             and .commit.verification.verified == true
             and .commit.verification.reason == "valid"' \
            <<<"$staging_commit" >/dev/null

          threads="$(gh api graphql \
            -F owner="${GITHUB_REPOSITORY%%/*}" \
            -F name="${GITHUB_REPOSITORY#*/}" \
            -F number="$TARGET_PR" \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved} pageInfo{hasNextPage}}}}}')"
          jq -e \
            '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage == false
             and ([.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length) == 0' \
            <<<"$threads" >/dev/null

          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_HEAD_SHA&event=pull_request&per_page=100")"
          expected=(
            "Validate Codestra service API contract"
            "Validate Codestra Prometheus corporate authority"
            "Controlled intake staging activation preparation gate"
            "Validate Prometheus upstream source authority"
            "Stage 6 intake observability contract certification"
            "Validate Codestra production server API contract"
            "Validate Codestra Prometheus corporate runtime v1"
            "Validate repository aliases and private exporter authority"
            "Validate Prometheus repository readiness"
          )
          for workflow in "${expected[@]}"; do
            jq -e \
              --arg name "$workflow" \
              '([.workflow_runs[] | select(.name == $name)] | sort_by(.run_number) | last)
               | .status == "completed" and .conclusion == "success"' \
              <<<"$runs" >/dev/null
          done
          jq -e \
            '[.workflow_runs[] | select(.status != "completed" or .conclusion != "success")] | length == 0' \
            <<<"$runs" >/dev/null

          printf 'EXACT_HEAD=%s\nEXACT_TREE=%s\nSIGNED_STAGING=%s\nALL_REQUIRED_WORKFLOWS=PASS\nUNRESOLVED_REVIEW_THREADS=0\n' \
            "$EXPECTED_HEAD_SHA" "$EXPECTED_TREE_SHA" "$SIGNED_STAGING_SHA"

      - name: Submit independent automated approval for exact head
        shell: bash
        run: |
          set -Eeuo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR")"
          test "$(jq -r .head.sha <<<"$current")" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r .base.sha <<<"$current")" = "$EXPECTED_BASE_SHA"
          body="Automated exact-head approval after independently verifying PR #${TARGET_PR}, head ${EXPECTED_HEAD_SHA}, signed staging source ${SIGNED_STAGING_SHA}, tree ${EXPECTED_TREE_SHA}, one-commit ancestry, all nine required workflows successful, and zero unresolved review threads. Approval covers repository source promotion only; runtime deployment remains separately gated."
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR/reviews" \
            -f event=APPROVE \
            -f commit_id="$EXPECTED_HEAD_SHA" \
            -f body="$body" \
            | jq -e '.state == "APPROVED"' >/dev/null
          printf 'AUTOMATED_EXACT_HEAD_APPROVAL=PASS\n'
