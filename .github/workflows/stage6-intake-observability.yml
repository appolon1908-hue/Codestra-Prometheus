name: Stage 6 intake observability contract certification

on:
  pull_request:
    paths:
      - "codestra/prometheus/prometheus.yml"
      - "codestra/prometheus/prometheus-staging.yml"
      - "codestra/prometheus/targets/staging.json"
      - "codestra/scripts/collect_staging_intake_evidence.py"
      - "codestra/scripts/collect_staging_intake_evidence_v2.py"
      - "codestra/scripts/validate_staging_intake_observability.py"
      - "codestra/scripts/validate_staging_intake_observability_source.py"
      - "codestra/scripts/validate_staging_intake_observability_activation.py"
      - "codestra/scripts/validate_staging_intake_observability_contract.py"
      - "integration/staging-activation-contract-v1.json"
      - "integration/staging-runtime-evidence-v1.json"
      - "tests/test_staging_intake_observability_contract.py"
      - "tests/test_collect_staging_intake_evidence.py"
      - "tests/test_collect_staging_intake_evidence_v2.py"
      - ".github/workflows/stage6-intake-observability.yml"
  push:
    branches: [main]
    paths:
      - "codestra/prometheus/prometheus.yml"
      - "codestra/prometheus/prometheus-staging.yml"
      - "codestra/prometheus/targets/staging.json"
      - "codestra/scripts/collect_staging_intake_evidence.py"
      - "codestra/scripts/collect_staging_intake_evidence_v2.py"
      - "codestra/scripts/validate_staging_intake_observability.py"
      - "codestra/scripts/validate_staging_intake_observability_source.py"
      - "codestra/scripts/validate_staging_intake_observability_activation.py"
      - "codestra/scripts/validate_staging_intake_observability_contract.py"
      - "integration/staging-activation-contract-v1.json"
      - "integration/staging-runtime-evidence-v1.json"
      - "tests/test_staging_intake_observability_contract.py"
      - "tests/test_collect_staging_intake_evidence.py"
      - "tests/test_collect_staging_intake_evidence_v2.py"
      - ".github/workflows/stage6-intake-observability.yml"

permissions:
  contents: read

concurrency:
  group: stage6-intake-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-source-or-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3
      - run: >-
          python -m py_compile
          codestra/scripts/collect_staging_intake_evidence.py
          codestra/scripts/collect_staging_intake_evidence_v2.py
          codestra/scripts/validate_staging_intake_observability.py
          codestra/scripts/validate_staging_intake_observability_source.py
          codestra/scripts/validate_staging_intake_observability_activation.py
          codestra/scripts/validate_staging_intake_observability_contract.py
      - name: Select fail-closed source or activation validation
        env:
          ACTIVATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python codestra/scripts/validate_staging_intake_observability_contract.py
      - run: python -m unittest discover -s tests -p 'test_collect_staging_intake_evidence*.py' -v
      - run: python -m unittest tests.test_staging_intake_observability_contract -v
      - name: Preserve activation boundary
        run: |
          echo 'BLACKBOX_TARGET=pending'
          echo 'CI_DEPLOYMENT_PERFORMED=NO'
          echo 'PRODUCTION_AUTHORIZED=NO'
          echo 'EXTERNAL_EFFECTS_ENABLED=false'
