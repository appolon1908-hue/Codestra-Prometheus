name: Apply production branch protection

on:
  push:
    branches:
      - governance/apply-production-protection-20260903

permissions:
  contents: read

concurrency:
  group: prometheus-production-protection
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CODESTRA_REPOSITORY_ADMIN_TOKEN: ${{ secrets.CODESTRA_REPOSITORY_ADMIN_TOKEN }}
      RULESET_NAME: prometheus-production-authority
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Apply and verify production-only ruleset
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("CODESTRA_REPOSITORY_ADMIN_TOKEN", "").strip()
          ruleset_name = os.environ["RULESET_NAME"]
          if not token:
              raise SystemExit("CODESTRA_REPOSITORY_ADMIN_TOKEN is required with repository Administration: write")

          base = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "codestra-prometheus-production-governance",
              "Content-Type": "application/json",
          }

          def request(method: str, path: str, payload: object | None = None, expected: tuple[int, ...] = (200,)):
              body = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
              req = urllib.request.Request(base + path, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      value = json.loads(raw.decode()) if raw else None
                      if response.status not in expected:
                          raise SystemExit(f"unexpected GitHub status {response.status} for {method} {path}")
                      return value
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace")[:1000]
                  raise SystemExit(f"GitHub API {method} {path} failed with {exc.code}: {detail}") from exc

          required_checks = [
              {"context": "validate-source"},
              {"context": "validate-merge-result"},
          ]
          desired = {
              "name": ruleset_name,
              "target": "branch",
              "enforcement": "active",
              "bypass_actors": [],
              "conditions": {
                  "ref_name": {
                      "include": ["refs/heads/production"],
                      "exclude": [],
                  }
              },
              "rules": [
                  {"type": "deletion"},
                  {"type": "non_fast_forward"},
                  {"type": "required_linear_history"},
                  {
                      "type": "pull_request",
                      "parameters": {
                          "allowed_merge_methods": ["squash"],
                          "dismiss_stale_reviews_on_push": True,
                          "require_code_owner_review": False,
                          "require_last_push_approval": True,
                          "required_approving_review_count": 1,
                          "required_review_thread_resolution": True,
                          "require_extra_approval_for_unattributed_changes": True,
                      },
                  },
                  {
                      "type": "required_status_checks",
                      "parameters": {
                          "do_not_enforce_on_create": False,
                          "strict_required_status_checks_policy": True,
                          "required_status_checks": required_checks,
                      },
                  },
              ],
          }

          observed = request("GET", "/rulesets?per_page=100&includes_parents=false")
          matches = [item for item in observed if item.get("name") == ruleset_name]
          if len(matches) > 1:
              raise SystemExit(f"multiple rulesets named {ruleset_name}")
          if matches:
              ruleset_id = int(matches[0]["id"])
              request("PUT", f"/rulesets/{ruleset_id}", desired)
              operation = "updated"
          else:
              created = request("POST", "/rulesets", desired, expected=(201,))
              ruleset_id = int(created["id"])
              operation = "created"

          live = request("GET", f"/rulesets/{ruleset_id}?includes_parents=false")
          if live.get("name") != ruleset_name or live.get("enforcement") != "active":
              raise SystemExit("production ruleset identity or enforcement drift")
          if live.get("bypass_actors") != []:
              raise SystemExit("production ruleset unexpectedly permits bypass actors")
          condition = live.get("conditions", {}).get("ref_name", {})
          if condition.get("include") != ["refs/heads/production"] or condition.get("exclude") != []:
              raise SystemExit("production ruleset ref scope drift")

          rules = {item.get("type"): item for item in live.get("rules", [])}
          required_types = {
              "deletion",
              "non_fast_forward",
              "required_linear_history",
              "pull_request",
              "required_status_checks",
          }
          if not required_types.issubset(rules):
              raise SystemExit("production ruleset is missing required rule types")

          pull = rules["pull_request"].get("parameters", {})
          if pull.get("required_approving_review_count", 0) < 1:
              raise SystemExit("production ruleset does not require approval")
          if pull.get("required_review_thread_resolution") is not True:
              raise SystemExit("production ruleset does not require thread resolution")
          if pull.get("dismiss_stale_reviews_on_push") is not True:
              raise SystemExit("production ruleset does not dismiss stale approvals")
          if pull.get("require_last_push_approval") is not True:
              raise SystemExit("production ruleset does not require independent last-push approval")

          checks = rules["required_status_checks"].get("parameters", {})
          contexts = {item.get("context") for item in checks.get("required_status_checks", [])}
          if contexts != {"validate-source", "validate-merge-result"}:
              raise SystemExit(f"production required-check drift: {sorted(contexts)}")
          if checks.get("strict_required_status_checks_policy") is not True:
              raise SystemExit("production ruleset does not require up-to-date checks")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("# Production branch protection\n\n")
                  handle.write(f"- Ruleset: `{ruleset_name}` ({operation})\n")
                  handle.write(f"- Ruleset ID: `{ruleset_id}`\n")
                  handle.write("- Scope: `refs/heads/production` only\n")
                  handle.write("- Force pushes: blocked\n")
                  handle.write("- Deletion: blocked\n")
                  handle.write("- Direct unreviewed changes: blocked\n")
                  handle.write("- Fresh independent approval: required\n")
                  handle.write("- Exact source and synthetic-merge checks: required\n")
          print(f"PRODUCTION_RULESET_ID={ruleset_id}")
          print("PRODUCTION_BRANCH_PROTECTION=PASS")
          PY
