name: Validate Codestra production server API contract

on:
  pull_request:
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - .github/workflows/validate-production-server-api-contract.yml
  push:
    branches: [development, test, staging, production, main]
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - .github/workflows/validate-production-server-api-contract.yml

permissions:
  contents: read

concurrency:
  group: prometheus-production-api-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate source-only production contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md').read_text(encoding='utf-8')
          required = [
              'appolon1908-hue/Codestra-Prometheus', '37.27.128.39',
              'SOURCE_CONTRACT_PREPARED_NOT_DEPLOYED', 'GET` | `/-/ready',
              'GET` | `/-/healthy', 'GET` | `/metrics', 'GET` | `/api/v1/query',
              'GET` | `/api/v1/query_range', 'GET` | `/api/v1/rules',
              'GET` | `/api/v1/alerts', 'ADMIN_ENDPOINTS_PUBLIC=NO',
              'UNEXPECTED_404=0', 'SOURCE_RUNTIME_DRIFT=0',
              'This document does not deploy Prometheus',
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f'missing production API contract controls: {missing}'
          forbidden = ['ADMIN_BYPASS_AUTHORIZED=YES', 'SSH_CONFIGURATION_CHANGES_AUTHORIZED=YES', ':latest']
          present = [value for value in forbidden if value in text]
          assert not present, f'forbidden production contract claims: {present}'
          print('CODESTRA_PROMETHEUS_PRODUCTION_API_CONTRACT=PASS')
          PY
