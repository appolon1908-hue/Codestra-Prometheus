name: Apply Prometheus review patch on remediation PR

on:
  pull_request:
    branches: [staging]
    paths:
      - "codestra/scripts/apply_production_review_patch_v2.py"
      - ".github/workflows/apply-prometheus-review-pr.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact remediation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Apply idempotent source patch
        run: |
          set -Eeuo pipefail
          python3 codestra/scripts/apply_production_review_patch_v2.py
          git diff --check
          echo "::group::FINAL_CONTROLLED_INTAKE_ACTIVATION_WORKFLOW"
          cat .github/workflows/controlled-intake-staging-activation-gate.yml
          echo "::endgroup::"

      - name: Commit source and production discovery corrections
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- \
            codestra/scripts/collect_staging_intake_evidence.py \
            codestra/prometheus/prometheus.yml; then
            echo "PROMETHEUS_SOURCE_REVIEW_PATCH_ALREADY_APPLIED=1"
            exit 0
          fi
          git config user.name "codestra-production-review"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            codestra/scripts/collect_staging_intake_evidence.py \
            codestra/prometheus/prometheus.yml
          git commit -m "fix(prometheus): require sampled families and production targets"
          git push origin "HEAD:$HEAD_REF"
