name: Codestra Upstream Source Sync

on:
  push:
    branches: [main]
    paths:
      - CODESTRA_UPSTREAM.json
      - .github/workflows/upstream-source-sync.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: codestra-upstream-source-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Codestra authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import official upstream source snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mapfile -t values < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('CODESTRA_UPSTREAM.json').read_text())
          print(data['upstream_clone_url']); print(data['trusted_upstream_ref']); print(data['upstream_ref']); print(data['import_path'])
          PY
          )
          UPSTREAM_URL="${values[0]}"; TRUSTED_UPSTREAM_REF="${values[1]}"; UPSTREAM_REF="${values[2]}"; IMPORT_PATH="${values[3]}"
          [[ "$UPSTREAM_URL" == "https://github.com/prometheus/prometheus.git" ]] || exit 2
          [[ "$TRUSTED_UPSTREAM_REF" == "refs/heads/main" ]] || exit 2
          [[ "$UPSTREAM_REF" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$IMPORT_PATH" == upstream ]] || exit 2
          rm -rf .codestra-upstream-src "$IMPORT_PATH"
          git init --quiet .codestra-upstream-src
          git -C .codestra-upstream-src remote add origin "$UPSTREAM_URL"
          GIT_LFS_SKIP_SMUDGE=1 git -C .codestra-upstream-src fetch --filter=blob:none --no-tags origin "${TRUSTED_UPSTREAM_REF}:refs/remotes/origin/codestra-trusted"
          git -C .codestra-upstream-src cat-file -e "${UPSTREAM_REF}^{commit}"
          git -C .codestra-upstream-src merge-base --is-ancestor "$UPSTREAM_REF" refs/remotes/origin/codestra-trusted
          git -C .codestra-upstream-src checkout --quiet --detach "$UPSTREAM_REF"
          UPSTREAM_SHA="$(git -C .codestra-upstream-src rev-parse HEAD)"
          [[ "$UPSTREAM_SHA" == "$UPSTREAM_REF" ]] || exit 2
          UPSTREAM_TIMESTAMP="$(git -C .codestra-upstream-src show -s --format=%cI "$UPSTREAM_SHA")"
          rm -rf .codestra-upstream-src/.git
          mv .codestra-upstream-src "$IMPORT_PATH"
          export UPSTREAM_URL TRUSTED_UPSTREAM_REF UPSTREAM_REF UPSTREAM_SHA UPSTREAM_TIMESTAMP
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lock_path=Path('CODESTRA_UPSTREAM_LOCK.json')
          lock_path.write_text(json.dumps({'schema_version':'1.0','upstream_clone_url':os.environ['UPSTREAM_URL'],'trusted_upstream_ref':os.environ['TRUSTED_UPSTREAM_REF'],'upstream_ref':os.environ['UPSTREAM_REF'],'upstream_commit':os.environ['UPSTREAM_SHA'],'import_path':'upstream','synchronized_at':os.environ['UPSTREAM_TIMESTAMP'],'deployment_enabled':False}, indent=2)+'\n')
          PY
          git config user.name 'codestra-upstream-sync'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          export GIT_AUTHOR_DATE="$UPSTREAM_TIMESTAMP"
          export GIT_COMMITTER_DATE="$UPSTREAM_TIMESTAMP"
          SYNC_BRANCH="sync/prometheus-upstream-${UPSTREAM_SHA}"
          git switch --create "$SYNC_BRANCH"
          git fetch --depth 1 --no-tags "$UPSTREAM_URL" "$UPSTREAM_SHA"
          git rm -r --cached --quiet --ignore-unmatch upstream
          git read-tree --prefix=upstream/ "${UPSTREAM_SHA}^{tree}"
          git add CODESTRA_UPSTREAM_LOCK.json
          git diff --cached --quiet && exit 0
          git commit -m "vendor: sync official upstream ${UPSTREAM_SHA}"
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/${SYNC_BRANCH}" | awk '{print $1}')"
          if [[ -n "$REMOTE_SHA" ]]; then
            [[ "$REMOTE_SHA" == "$LOCAL_SHA" ]] || {
              echo "Existing sync branch differs; refusing to replace it." >&2
              exit 3
            }
          else
            git push origin "HEAD:refs/heads/${SYNC_BRANCH}"
          fi
          mapfile -t OPEN_PRS < <(
            gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --head "$SYNC_BRANCH" --json number --jq '.[].number'
          )
          if (( ${#OPEN_PRS[@]} > 1 )); then
            echo "Multiple open synchronization pull requests found." >&2
            exit 3
          elif (( ${#OPEN_PRS[@]} == 0 )); then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "vendor: sync reviewed Prometheus upstream ${UPSTREAM_SHA}" \
              --body "Pins and imports the exact Prometheus upstream commit ${UPSTREAM_SHA}. Deployment remains disabled. This PR requires normal source validation and independent review."
          fi
          gh workflow run codestra-observability.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
          gh workflow run validate-codestra-corporate-runtime-v1.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
